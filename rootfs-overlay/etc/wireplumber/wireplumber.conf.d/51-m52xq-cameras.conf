# M52XQ (Phosh): names and order of the cameras in PipeWire (Snapshot / Camera app, Firefox, ...).
# libcamera creates one node per sensor; without this rule all of them are "Built-in Back Camera" or alike and the
# default is the one with the highest priority.session (the front camera had 800, the rear ones 750).
# Order chosen by the user: main -> front -> macro -> wide (names are English).
#   camera@2d  s5kgw3  main 64 MP (cci@ac4a000)
#   camera@1a  imx616  front       (cci@ac4b000)
#   camera@3f  gc5035  macro       (cci@ac4b000)
#   camera@10  imx258  wide        (cci@ac4b000)
monitor.libcamera.rules = [
  {
    matches = [ { node.name = "~libcamera_input.*_camera_2d" } ]
    actions = { update-props = { node.description = "Main 64 MP", priority.session = 1000 } }
  }
  {
    matches = [ { node.name = "~libcamera_input.*_camera_1a" } ]
    actions = { update-props = { node.description = "Front", priority.session = 900 } }
  }
  {
    matches = [ { node.name = "~libcamera_input.*_camera_3f" } ]
    actions = { update-props = { node.description = "Macro", priority.session = 800 } }
  }
  {
    matches = [ { node.name = "~libcamera_input.*_camera_10" } ]
    actions = { update-props = { node.description = "Wide", priority.session = 700 } }
  }
]
