# M52XQ (Phosh): no V4L2 devices in PipeWire. The cameras come through libcamera (51-m52xq-cameras.conf); the V4L2
# nodes were the raw "Qualcomm Camera Subsystem" video nodes, the Venus codec and the m52xq-virtualcam loopbacks
# "Phone camera front/rear". When Snapshot started, PipeWire opened the loopbacks, m52xq-virtualcam took a real camera
# for them and Snapshot lost cameras (only "Main 64 MP" left, macro did not start). Telegram and other V4L2 apps open
# /dev/video20 and /dev/video21 directly, without PipeWire, so they keep the virtual cameras.
wireplumber.profiles = {
  main = {
    monitor.v4l2 = disabled
  }
}
