# m52xq: overrides /usr/lib/sysctl.d/50-coredump.conf. systemd-coredump's sd-parse-elf crashes (SIGSEGV) on every dump
# here; until it finishes, the kernel keeps the crashed program alive -> phosh / Snapshot hung on screen and could not be
# closed, and the crashing parser dumped itself in a loop. No core dumps: a crashed program exits at once.
kernel.core_pattern=|/bin/false
