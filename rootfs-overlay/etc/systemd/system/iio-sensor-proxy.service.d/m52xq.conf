# M52XQ: iio-sensor-proxy after the ADSP sensor PD. No waiting here (2026-11-11): Phosh asks for the service when the
# session starts, and a D-Bus activation held back by a long ExecStartPre left Phosh's rotation without the sensor.
# The accelerometer, which the ADSP registers later, is picked up by m52xq-sensor-kick (one restart of this service).
[Unit]
After=hexagonrpcd-adsp-sensorspd.service
