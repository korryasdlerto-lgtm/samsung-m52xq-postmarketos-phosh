# M52XQ (Phosh): no connectivity check. After every wake-up NetworkManager brings up the mobile data and Wi-Fi again, and for a second the state
# was CONNECTED_SITE (the check through the mobile data, whose operator may redirect to a "no money" page, had not finished yet):
# Phosh showed the notification "Sign in to network", it lit the screen and disappeared when the check passed (2026-11-12 13:07:36).
# Without the check no such notification; a hotspot with a login page has to be opened in the browser by hand.
[connectivity]
enabled=false
